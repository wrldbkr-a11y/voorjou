<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Are you ready for it?</title>
<meta property="og:title" content="Are you ready for it?">
<meta property="og:description" content="Vrijdag 20 november, 15u00">
<meta name="description" content="Vrijdag 20 november, 15u00">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --goud: #e9c27a;
    --goud-licht: #f7e2b5;
    --goud-donker: #b9853a;
    --bruin: #2a1c0e;
    --bruin-zacht: #3d2914;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Lora', Georgia, serif;
    color: var(--goud-licht);
    background:
      radial-gradient(ellipse at 50% 0%, #6b4a1f 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, #4a3215 0%, transparent 55%),
      var(--bruin);
    display: flex;
    justify-content: center;
    padding: 28px 18px 48px;
  }
  main { width: 100%; max-width: 460px; }

  .cover {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(233,194,122,.25), 0 20px 60px rgba(0,0,0,.5), 0 0 80px rgba(233,194,122,.18);
    opacity: 0;
    transform: translateY(12px);
    animation: binnen 1.2s ease-out .1s forwards;
  }
  .cover img { display: block; width: 100%; height: auto; }

  h2 {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 2rem;
    color: var(--goud);
    text-align: center;
    margin: 30px 0 14px;
    opacity: 0;
    animation: binnen 1s ease-out .6s forwards;
  }

  .track {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border-radius: 14px;
    background: rgba(61,41,20,.7);
    border: 1px solid rgba(233,194,122,.18);
    transition: border-color .3s, background .3s;
    opacity: 0;
    animation: binnen .9s ease-out forwards;
  }
  .track:nth-of-type(1) { animation-delay: .8s; }
  .track:nth-of-type(2) { animation-delay: 1s; }
  .track.speelt {
    border-color: rgba(233,194,122,.6);
    background: rgba(82,56,26,.8);
  }

  .knop {
    flex: 0 0 auto;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(145deg, var(--goud-licht), var(--goud-donker));
    color: var(--bruin);
    display: grid;
    place-items: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .15s;
  }
  .knop:active { transform: scale(.94); }
  .knop svg { width: 22px; height: 22px; fill: currentColor; }
  .knop .pauze { display: none; }
  .track.speelt .knop .play { display: none; }
  .track.speelt .knop .pauze { display: block; }

  .info { flex: 1; min-width: 0; }
  .titel { font-weight: 500; font-size: 1.05rem; }
  .sub { font-size: .85rem; color: var(--goud); opacity: .8; margin-top: 1px; }

  .balk {
    position: relative;
    height: 6px;
    margin-top: 10px;
    border-radius: 3px;
    background: rgba(247,226,181,.15);
    cursor: pointer;
    touch-action: none;
  }
  .balk::before { /* groter klikvlak */
    content: ''; position: absolute; inset: -10px 0;
  }
  .vulling {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--goud-donker), var(--goud-licht));
  }
  .tijd {
    display: flex; justify-content: space-between;
    font-size: .75rem; opacity: .65; margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }
  .fout { font-size: .8rem; color: #f0a07a; margin-top: 6px; display: none; }

  @keyframes binnen { to { opacity: 1; transform: none; } }
  /* Aftelscherm */
  main { display: none; }
  body.open main { display: block; }
  body.open #aftel { display: none; }
  #aftel {
    min-height: calc(100vh - 76px);
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: binnen 1.2s ease-out forwards;
    opacity: 0;
  }
  #aftel .zin {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    font-size: 2.8rem;
    line-height: 1.1;
    color: var(--goud);
    text-shadow: 0 0 30px rgba(233,194,122,.35);
    margin-bottom: 34px;
  }
  .klok { display: flex; gap: 10px; justify-content: center; }
  .eenheid {
    width: 74px;
    padding: 14px 0 10px;
    border-radius: 14px;
    background: rgba(61,41,20,.7);
    border: 1px solid rgba(233,194,122,.25);
  }
  .getal {
    font-size: 1.9rem;
    font-weight: 500;
    color: var(--goud-licht);
    font-variant-numeric: tabular-nums;
  }
  .label { font-size: .72rem; color: var(--goud); opacity: .8; margin-top: 2px; letter-spacing: .04em; }

  @media (prefers-reduced-motion: reduce) {
    .cover, h2, .track, #aftel { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<section id="aftel">
  <div class="zin">Are you ready for it?</div>
  <div class="klok">
    <div class="eenheid"><div class="getal" id="d">–</div><div class="label">dagen</div></div>
    <div class="eenheid"><div class="getal" id="u">–</div><div class="label">uren</div></div>
    <div class="eenheid"><div class="getal" id="m">–</div><div class="label">minuten</div></div>
    <div class="eenheid"><div class="getal" id="s">–</div><div class="label">seconden</div></div>
  </div>
</section>

<main>
  <div class="cover">
    <img data-src="cover.jpg" alt="Jij bent goud">
  </div>

  <h2>Voor jou</h2>

  <div class="track" data-src="jij-bent-goud.m4a">
    <button class="knop" aria-label="Afspelen">
      <svg class="play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg class="pauze" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <div class="info">
      <div class="titel">Jij bent goud</div>
      <div class="balk"><div class="vulling"></div></div>
      <div class="tijd"><span class="nu">0:00</span><span class="duur">–:––</span></div>
      <div class="fout">Bestand niet gevonden.</div>
    </div>
  </div>

  <div class="track" data-src="jij-bent-goud-deephouse-remix.m4a">
    <button class="knop" aria-label="Afspelen">
      <svg class="play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg class="pauze" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <div class="info">
      <div class="titel">Jij bent goud</div>
      <div class="sub">deephouse remix</div>
      <div class="balk"><div class="vulling"></div></div>
      <div class="tijd"><span class="nu">0:00</span><span class="duur">–:––</span></div>
      <div class="fout">Bestand niet gevonden.</div>
    </div>
  </div>
</main>

<script>
  // Opent vrijdag 20 november 2026 om 15:00 (Belgische tijd)
  const OPENING = new Date('2026-11-20T15:00:00+01:00').getTime();

  const tracks = [...document.querySelectorAll('.track')];
  const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '–:––';
  let spelers = [];

  function openen() {
    const img = document.querySelector('.cover img');
    img.src = img.dataset.src;
    document.body.classList.add('open');
    document.title = 'Jij bent goud';
    window.scrollTo(0, 0);
    spelers = tracks.map(maakSpeler);
  }

  // Geheime voorbeeldlink: voeg ?voorbeeld=goud toe aan het adres
  const VOORBEELD = new URLSearchParams(location.search).get('voorbeeld') === 'goud';

  function aftellen() {
    const rest = VOORBEELD ? 0 : OPENING - Date.now();
    if (rest <= 0) { openen(); return; }
    const t = Math.floor(rest / 1000);
    document.getElementById('d').textContent = Math.floor(t / 86400);
    document.getElementById('u').textContent = String(Math.floor(t % 86400 / 3600)).padStart(2, '0');
    document.getElementById('m').textContent = String(Math.floor(t % 3600 / 60)).padStart(2, '0');
    document.getElementById('s').textContent = String(t % 60).padStart(2, '0');
    setTimeout(aftellen, 1000 - (rest % 1000) + 20);
  }

  function maakSpeler(el) {
    const audio = new Audio();
    audio.preload = 'metadata';
    audio.src = el.dataset.src;
    const knop = el.querySelector('.knop');
    const balk = el.querySelector('.balk');
    const vulling = el.querySelector('.vulling');
    const nu = el.querySelector('.nu');
    const duur = el.querySelector('.duur');

    audio.addEventListener('loadedmetadata', () => duur.textContent = fmt(audio.duration));
    audio.addEventListener('timeupdate', () => {
      nu.textContent = fmt(audio.currentTime);
      vulling.style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
    });
    audio.addEventListener('play', () => {
      spelers.forEach(s => { if (s.audio !== audio) s.audio.pause(); });
      el.classList.add('speelt');
      knop.setAttribute('aria-label', 'Pauzeren');
    });
    audio.addEventListener('pause', () => {
      el.classList.remove('speelt');
      knop.setAttribute('aria-label', 'Afspelen');
    });
    audio.addEventListener('ended', () => { audio.currentTime = 0; });
    audio.addEventListener('error', () => { el.querySelector('.fout').style.display = 'block'; });

    knop.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());

    const zoek = e => {
      if (!audio.duration) return;
      const r = balk.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
      audio.currentTime = x / r.width * audio.duration;
    };
    balk.addEventListener('pointerdown', e => {
      zoek(e);
      balk.setPointerCapture(e.pointerId);
      const beweeg = ev => zoek(ev);
      balk.addEventListener('pointermove', beweeg);
      balk.addEventListener('pointerup', () => balk.removeEventListener('pointermove', beweeg), { once: true });
    });

    return { audio };
  }

  aftellen();
</script>
</body>
</html>
